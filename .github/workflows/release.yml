name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -s "docs/releases/$RELEASE_TAG.md"
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m json.tool assets/assets.json > /dev/null

      - name: Run regression tests
        run: swift test

      - name: Build and verify the universal app
        shell: bash
        run: |
          bash scripts/build_app.sh
          plutil -lint build/Naiwa.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Naiwa.app/Contents/Info.plist)" = "${RELEASE_TAG#v}"
          lipo build/Naiwa.app/Contents/MacOS/naiwa -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/Naiwa.app
          build/Naiwa.app/Contents/MacOS/naiwa pets

      - name: Archive and checksum
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Naiwa.app "dist/Naiwa-$RELEASE_TAG-macos-universal.zip"
          cd dist
          shasum -a 256 "Naiwa-$RELEASE_TAG-macos-universal.zip" > SHA256SUMS.txt

      - name: Publish release with both assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          cp "docs/releases/$RELEASE_TAG.md" dist/notes.md
          printf '\n源码提交：`%s`\n' "$(git rev-parse HEAD)" >> dist/notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "奶蛙 $RELEASE_TAG" --notes-file dist/notes.md \
            "dist/Naiwa-$RELEASE_TAG-macos-universal.zip" dist/SHA256SUMS.txt
          gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[] | select(.state == "uploaded" and .size > 0)] | length' | \
            { read -r count; test "$count" = 2; }
          gh release edit "$RELEASE_TAG" --draft=false --latest
